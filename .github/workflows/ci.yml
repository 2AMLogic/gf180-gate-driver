name: CI

# Green/red gate for every PR and every push to main. Everything in this file
# is headless and PDK-free: it runs on a bare ubuntu runner with nothing but
# python3 (stdlib) and shellcheck, so a PR is never blocked on downloading a
# ~1 GB PDK or on building xschem.
#
# | Self-check                                   | Needs        | Runs in       |
# |----------------------------------------------|--------------|----------------|
# | `.github/scripts/lint.sh`                     | python3      | `lint` (here)  |
# | evidence-record format + append-only          | python3+git  | `lint` (here)  |
# | testbench manifests load (`--list`)           | python3      | `test` (here)  |
# | `sim/test_harness_checks.py`                  | python3      | `test` (here)  |
# | `sim/test_harness_runner.py`                  | python3      | `test` (here)  |
# | `layout/test_gen_gate_driver_core.py`         | python3      | `test` (here)  |
# | `layout/common/test_power_array_folded.py`    | python3      | `test` (here)  |
# | `.loom/hooks/tests/*.sh` regression suites     | bash         | `test` (here)  |
#
# Deliberate exclusion: actually *running* the PVT sweep needs ngspice and
# the gf180mcu PDK, neither of which belongs on the pull_request path (a
# multi-GB PDK fetch should not gate every PR). `--check-env` is exercised
# here but its exit code is not gated on, since this runner never has the
# PDK installed -- it is expected to report "PDK: MISSING" with the install
# hint, which is the documented, correct behavior (sim/harness/README.md),
# not a bug. `sim/` results are append-only evidence (CLAUDE.md) produced
# deliberately by a human or agent, never minted by a CI robot.
#
# Evidence-record *format* linting (the schema in sim/README.md) is step 4 of
# `.github/scripts/lint.sh` -- CI does not mint evidence, but it does check the
# shape of the evidence a PR adds, and enforces the append-only rule against
# the merge base.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck + syntax + evidence records)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The append-only evidence check (lint step 4/4) diffs against
          # `git merge-base origin/main HEAD`. The default depth-1 checkout has
          # neither origin/main nor enough history for a merge base, which would
          # silently downgrade that check to a SKIP -- hence full history.
          fetch-depth: 0

      - name: Lint
        # --require-shellcheck: shellcheck is preinstalled on GitHub's ubuntu
        # runner images, so a missing binary here means the image changed and
        # the shell scripts silently stopped being linted -- fail instead.
        # --require-append-only: same argument for the merge base -- if it stops
        # resolving, fail loudly instead of passing on a skipped check.
        # Same script `npm run lint` runs locally.
        run: .github/scripts/lint.sh --require-shellcheck --require-append-only

  test:
    name: Harness self-test (no PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The harness is stdlib-only (sim/harness/README.md: python3 >= 3.9,
          # no venv, no packages), so there is nothing to install and no
          # dependency matrix to sweep -- one modern interpreter is the check.
          python-version: '3.12'

      - name: Testbench manifests load
        # `--list` deliberately keeps listing after a bad manifest, printing
        # `!!` instead of exiting non-zero, so grep for that marker: a malformed
        # tb.json must fail the PR, not surface at simulation time.
        run: |
          set -euo pipefail
          out="$(python3 sim/run_corners.py --list)"
          echo "$out"
          if grep -q '!!' <<<"$out"; then
            echo "::error::a testbench manifest failed to load (see the '!!' line above)"
            exit 1
          fi

      - name: Harness spec-check unit tests
        # sim/test_harness_checks.py pins how `checks` bounds are evaluated,
        # including the corner-scoped nominal/stretch override (issue #125).
        # Pure stdlib arithmetic over synthetic measurements -- no ngspice, no
        # PDK -- so it belongs on this PDK-free runner. It is the only check
        # that a stretch bound is actually applied at the stretch corner: the
        # failure mode it guards (a loose bound recorded as if it were the
        # tight one) looks identical to a passing run in the record itself.
        run: python3 sim/test_harness_checks.py

      - name: Harness deck-composition unit tests
        # sim/test_harness_runner.py pins that compose_deck() always emits
        # `set num_threads=1` in the generated .control block (issue #146):
        # a locally built, OpenMP-enabled ngspice's own spinit can default to
        # a thread count > 1, which is pure oversubscription once run_corners
        # is already parallelizing with -j -- measured at ~2000x slower for
        # byte-identical results. It also pins the harness-default
        # `reltol=1e-4` transient tolerance (issue #156): the harness-default
        # deck's un-clamped timestep under-resolved every recorded spec §2.3
        # gate-ceiling peak by ~25%, and this asserts the tightened default
        # stays in the generated deck, honors a manifest override without
        # double-setting it, and is recorded on the record's Environment
        # block. Pure string/record composition over synthetic
        # Testbench/Pdk/PvtPoint inputs -- no ngspice, no PDK -- so it belongs
        # on this PDK-free runner.
        run: python3 sim/test_harness_runner.py

      - name: Layout generator unit tests
        # layout/test_gen_gate_driver_core.py pins how the generator reads a
        # netlist device's W/nf/m (issue #129). Pure stdlib arithmetic -- no
        # klt, no PDK, no GDS -- so it belongs on this PDK-free runner, and it
        # is the only check of that interpretation that is *independent* of it:
        # check_gate_driver_core.py imports the same parser it audits against.
        run: python3 layout/test_gen_gate_driver_core.py

      - name: Folded power-array generator unit tests
        # layout/common/test_power_array_folded.py pins power_array_folded.py
        # (issue #254): the rows=1/rows=2-only fold split (AC2's rows>2
        # refusal), the mirror_y cross-row tie geometry (pinned against a
        # real klt gen mos_array response, hand-computed), and the AC3
        # connectivity verdict against synthetic klt extract facts -- pure
        # stdlib arithmetic, no klt, no PDK, no GDS, so it belongs on this
        # same PDK-free runner.
        run: python3 layout/common/test_power_array_folded.py

      - name: LVS reference-netlist unit tests
        # layout/lvs/test_make_reference.py pins the structural facts (PMOS
        # bodies tie to the schematic's own VDD_LOGIC/VDD_DRV -- issue #132's
        # well-tie geometry -- one shared NMOS substrate net, generic
        # nfet/pfet device classes) that make_reference.py's deck-compatible
        # reference build depends on -- issue #105. Pure stdlib arithmetic on
        # top of gen_gate_driver_core.parse_netlist, no klt/PDK/GDS, so it
        # belongs on this same PDK-free runner; the actual `klt drc`/`klt lvs`
        # run (layout/drc/run_drc.py, layout/lvs/run_lvs.py) needs klt + the
        # PDK and is run and committed as evidence by a developer/agent box,
        # not minted by CI (same convention as sim/, CLAUDE.md).
        run: python3 layout/lvs/test_make_reference.py

      - name: Post-layout DUT merged-ground parasitic unit tests
        # layout/lvs/test_mk_extracted_dut.py pins the one transform whose
        # wrong form still produces a plausible, simulatable netlist: the
        # merged GND_DRV|GND_LOGIC net's parasitic star must be emitted with
        # each leg's hub rebound to that leg's OWN device's rail (issue #184).
        # Skipping the star leaves both rails ideal (optimistic for
        # undershoot); a shared hub routes the output stage's return current
        # through the testbench's inter-rail tie (known wrong, see
        # MERGED_GROUND_RAW). Neither shows up as an error at run time, so it
        # is pinned here. Builds the DUT in-process from the same committed
        # extraction JSON the --check step below uses -- no klt/PDK/ngspice.
        run: python3 layout/lvs/test_mk_extracted_dut.py

      - name: Extracted post-layout DUT netlists are in sync with their reports
        # mk_extracted_dut.py --check re-derives each committed DUT netlist
        # from the committed `klt extract` JSON report it names and fails if
        # they have drifted -- so an edited-by-hand DUT, or a transform change
        # that was never re-applied, cannot reach a sim record. Reads only
        # committed JSON, no klt/PDK/GDS, so it runs on this PDK-free runner.
        run: |
          set -euo pipefail
          python3 layout/lvs/mk_extracted_dut.py --check \
            --extract layout/lvs/reports/gate_driver_core/20260826-062806-a7dcce1.extract.json \
            --combine -o layout/lvs/gate_driver_core.extracted.spice
          python3 layout/lvs/mk_extracted_dut.py --check \
            --extract layout/lvs/reports/gate_driver_core/20260826-062028-a7dcce1.pex-extract.json \
            -o layout/lvs/gate_driver_core.extracted-rc.spice

      - name: Environment check (informational -- no PDK on this runner)
        # sim/harness/README.md's documented contract: --check-env exits 3
        # and prints an actionable install hint when the PDK is absent. That
        # is not a CI failure; the PDK-required sweep runs on a developer or
        # agent box with the PDK installed (sim/env.sh, --check-env).
        run: python3 sim/run_corners.py --check-env || true

      - name: Hook regression suites (guard-destructive-generic.sh)
        # .loom/hooks/ is vendored and deliberately excluded from the `lint`
        # job's shellcheck sweep (see that job's own header comment), but its
        # regression suites are plain bash with no PDK/toolchain dependency,
        # so they run here. All seven suites must report a FULL pass count --
        # a future `chore: resync installed Loom surfaces` that silently
        # drops a locally-vendored fix (as c7ba31d did to two of these, #25)
        # must fail CI instead of only surfacing days later via
        # `.loom/logs/guard-decisions.log`. Each script itself exits non-zero
        # on any failed case (see its own trailing `[[ $FAIL -eq 0 ]]` /
        # `exit 1`), so `set -e` alone is the gate -- no separate pass-count
        # parsing needed here.
        run: |
          set -euo pipefail
          bash .loom/hooks/tests/test-guard-destructive-worktree-confinement.sh
          bash .loom/hooks/tests/test-guard-git-clean-scope.sh
          bash .loom/hooks/tests/test-strip-literal-text-bsq.sh
          bash .loom/hooks/tests/test-guard-catastrophic-rm-heredoc.sh
          bash .loom/hooks/tests/test-guard-heredoc-interpreter-masking.sh
          bash .loom/hooks/tests/test-guard-destructive-sed-bsd-inplace.sh
          bash .loom/hooks/tests/test-guard-sql-ddl-jq-prose.sh
          bash .loom/hooks/tests/test-guard-force-push-literal-masking.sh
          bash .loom/hooks/tests/test-guard-readonly-fastpath-pipe.sh

  signoff:
    name: Signoff manifest freshness (klt signoff)
    # The graded gap-to-T1 verdict's own freshness gate (issue #239). The
    # committed block manifest + tier report under verification/signoff/
    # are this block's verdict of record; this job re-anchors every
    # citation's pinned content_hash to the live tree and re-runs the
    # grading, so a manifest citing an artifact that has since changed
    # fails here instead of rotting (issue #239's acceptance criteria).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install klt (signoff-only, --no-deps)
        # `klt signoff --manifest` reads committed JSON envelopes and
        # parses the tiers doc bundled inside the klayout-tools wheel; it
        # never imports the klayout module and needs no PDK, so --no-deps
        # keeps this PDK-free runner light. The PyPI 0.5.0 wheel is NOT
        # usable here: it was built from the v0.5.0 tag and predates both
        # the 2026-09-17 eleventh tiers item (klayout-tools #2025) and the
        # report's source_doc_content_hash schema (#2191), so its render
        # can never match the committed 11-item tier report. This pin is
        # the exact source commit the report was graded with -- moving it
        # is a deliberate PR that also refreshes verification/signoff/
        # (the fresh render is diffed against the committed report below),
        # never a silent grading change; when a PyPI release carrying item
        # 11 lands, replace both install lines with that pinned release.
        # jsonschema is installed because klt's CLI entry imports it
        # eagerly (klt kb validate; observed as a CI failure on the first
        # run of this job), while klayout itself stays unnecessary.
        run: |
          pip install --no-deps "git+https://github.com/2AMLogic/klayout-tools@2b1e55e51bb803c082e8857da44687f3e37ebfc0"
          pip install 'jsonschema>=4.0'

      - name: Re-grade the committed block manifest
        # Exit 3 from the re-run means "rendered successfully with honestly
        # unmet items" -- tiers below T1 are this block's real state, not a
        # CI failure (see check_tier_report.py's header). Only a stale pin,
        # a changed artifact, or a drifted report fails.
        run: python3 verification/signoff/check_tier_report.py
